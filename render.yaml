# Render.com 一键部署配置（无需 Dockerfile）
# 用法：把本仓库推到 GitHub → Render 新建 "Web Service" → 关联仓库 → 自动读取此文件
# 注意：必须是「Web Service」类型（会运行 server.js），不能是「Static Site」（静态站不会执行 Node 后端）
services:
  - type: web
    name: travel-board
    runtime: node
    plan: starter        # 付费实例：支持挂载持久磁盘（/data 跨部署保留）。免费版不能挂磁盘、部署即清空。
    buildCommand: "npm install"
    startCommand: "node server.js"
    healthCheckPath: "/"  # 服务根路径返回 200，Render 据此判定已启动
    envVars:
      - key: BOARD_PASSWORD
        sync: false       # 部署后在 Render 控制台手动设置你的强密码（务必设置，否则用默认弱密码）
      # 持久化（重要）：付费实例 + 已挂持久磁盘到 /data → 后端写入的看板跨部署/重启保留。
      # BOARD_BACKEND=1 已开启后端文件存储（服务端 /data 永久存档 + SSE 多人实时），配合下方 disks 持久磁盘生效。
      # （免费版不能挂磁盘、/data 部署即清空；本配置已升级为 starter 付费实例以支持磁盘。）
      - key: DATA_DIR
        value: /data
      - key: BOARD_BACKEND
        value: "1"        # 开启后端文件存储（服务端 /data 永久存档 + SSE 多人实时）；需配合付费实例 + 已挂磁盘（见下方 disks）才跨部署保留
      # Google Maps API Key（密钥）：后端从环境变量读取，并注入前端 window.BOARD_CONFIG.gmapsApiKey
      # （见 server.js 的 /config.js 与 module-map.js 的 gmapsKey()）。请勿在源码里硬编码 Key。
      # 建议同步在 Google Cloud 对该 Key 设置「API 限制」(仅 Maps JS API + Geocoding API) 与
      # 「应用限制」(HTTP 引荐来源限制为本站域名)，避免被盗刷产生费用。
      - key: GMAPS_API_KEY
        sync: false
      # 可选：Google Maps Map ID（在 Google Cloud 控制台「地图管理」创建）。设置后地图改用
      # AdvancedMarkerElement（消除 google.maps.Marker 弃用告警）；不设置则回退经典 Marker。
      - key: GMAPS_MAP_ID
        sync: false
      # PORT 由 Render 自动注入，server.js 已通过 process.env.PORT 读取，无需设置
    # 持久磁盘：starter 付费实例可用。挂载到 /data 后，后端写入的 board.json 跨部署/重启保留。
    disks:
      - name: travel-data
        mountPath: /data
        sizeGB: 1
