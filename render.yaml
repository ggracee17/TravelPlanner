# Render.com 一键部署配置（无需 Dockerfile）
# 用法：把本仓库推到 GitHub → Render 新建 "Web Service" → 关联仓库 → 自动读取此文件
# 注意：必须是「Web Service」类型（会运行 server.js），不能是「Static Site」（静态站不会执行 Node 后端）
services:
  - type: web
    name: travel-board
    runtime: node
    plan: free            # 免费额度，足够家庭出行规划；免费版会休眠，但挂了持久磁盘后数据不丢
    buildCommand: "npm install"
    startCommand: "node server.js"
    healthCheckPath: "/"  # 服务根路径返回 200，Render 据此判定已启动
    envVars:
      - key: BOARD_PASSWORD
        sync: false       # 部署后在 Render 控制台手动设置你的强密码（务必设置，否则用默认弱密码）
      # 持久化：数据写本地文件 DATA_DIR。把下方 disks 持久磁盘挂到 /data，并设 DATA_DIR=/data，
      # 即可在重部署/休眠后保留数据，且零外部 API 调用（不再用 GitHub Gist，避免触发限流）。
      - key: DATA_DIR
        value: /data
      # Google Maps API Key（密钥）：后端从环境变量读取，并注入前端 window.BOARD_CONFIG.gmapsApiKey
      # （见 server.js 的 /config.js 与 module-map.js 的 gmapsKey()）。请勿在源码里硬编码 Key。
      # 建议同步在 Google Cloud 对该 Key 设置「API 限制」(仅 Maps JS API + Geocoding API) 与
      # 「应用限制」(HTTP 引荐来源限制为本站域名)，避免被盗刷产生费用。
      - key: GMAPS_API_KEY
        sync: false
      # 一次性迁移（可选）：若希望服务器在「持久磁盘首次为空」时自动从旧 GitHub Gist 导入数据，
      # 可临时在此填入 GIST_ID 与 GITHUB_TOKEN（与下方同名）。导入成功后即可删除这两个变量，
      # 日常运行不再访问 GitHub（零外部 API 调用）。若已撤销 token / 不想用此方式，
      # 改用 tools/migrate-gist-to-disk.js 生成仓库根 seed-board.json 提交即可（同样只导入一次）。
      - key: GIST_ID
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      # PORT 由 Render 自动注入，server.js 已通过 process.env.PORT 读取，无需设置
    disks:
      - name: travel-data
        mountPath: /data
        sizeGB: 1
